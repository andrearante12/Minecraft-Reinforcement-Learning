<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t d">
  <title id="t">Parkour architecture</title>
  <desc id="d">A 159-d state of body, landing offset, and occupancy voxels is encoded by a PPO actor-critic into a 15-action policy and a value estimate.</desc>
  <rect width="800" height="300" fill="#efe9db"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8a7340"/>
    </marker>
  </defs>
  <g font-family="IBM Plex Mono, ui-monospace, monospace">

    <!-- STATE -->
    <text x="132" y="32" text-anchor="middle" fill="#8a7340" font-size="11" letter-spacing="0.18em">STATE</text>
    <rect x="24" y="46" width="216" height="230" fill="#f7f2e6" stroke="rgba(28,26,22,0.16)" stroke-width="1.25"/>
    <text x="40" y="72" fill="#1c1a16" font-size="13">159-d observation</text>
    <text x="40" y="90" fill="#5c574e" font-size="11">no pixels</text>
    <line x1="40" y1="102" x2="224" y2="102" stroke="rgba(28,26,22,0.12)"/>

    <text x="40" y="128" fill="#8a7340" font-size="11">body</text>
    <text x="96" y="128" fill="#1c1a16" font-size="12">6</text>
    <text x="40" y="144" fill="#5c574e" font-size="10">on-ground, look, Δpos</text>

    <text x="40" y="170" fill="#8a7340" font-size="11">landing</text>
    <text x="96" y="170" fill="#1c1a16" font-size="12">3</text>
    <text x="40" y="186" fill="#5c574e" font-size="10">Δx Δy Δz to the far pad</text>

    <text x="40" y="212" fill="#8a7340" font-size="11">voxels</text>
    <text x="96" y="212" fill="#1c1a16" font-size="12">150</text>
    <text x="40" y="228" fill="#5c574e" font-size="10">5×5×6 at the feet</text>
    <g transform="translate(40 240)">
      <rect width="9" height="9" fill="#c4a35a"/>
      <rect x="11" width="9" height="9" fill="#8a7340"/>
      <rect x="22" width="9" height="9" fill="#d8d2c4"/>
      <rect x="33" width="9" height="9" fill="#c4a35a"/>
      <rect x="44" width="9" height="9" fill="#d8d2c4"/>
      <rect y="11" width="9" height="9" fill="#8a7340"/>
      <rect x="11" y="11" width="9" height="9" fill="#d8d2c4"/>
      <rect x="22" y="11" width="9" height="9" fill="#c4a35a"/>
      <rect x="33" y="11" width="9" height="9" fill="#d8d2c4"/>
      <rect x="44" y="11" width="9" height="9" fill="#8a7340"/>
    </g>

    <line x1="252" y1="161" x2="292" y2="161" stroke="#8a7340" stroke-width="1.6" marker-end="url(#arr)"/>

    <!-- NETWORK -->
    <text x="400" y="32" text-anchor="middle" fill="#8a7340" font-size="11" letter-spacing="0.18em">NETWORK</text>
    <rect x="304" y="46" width="192" height="230" fill="#f7f2e6" stroke="rgba(28,26,22,0.16)" stroke-width="1.25"/>
    <text x="400" y="72" text-anchor="middle" fill="#1c1a16" font-size="13">PPO actor-critic</text>
    <text x="400" y="90" text-anchor="middle" fill="#5c574e" font-size="10">three streams, then join</text>

    <rect x="320" y="110" width="50" height="24" fill="#efe9db" stroke="#8a7340"/>
    <text x="345" y="126" text-anchor="middle" fill="#1c1a16" font-size="10">body</text>
    <rect x="375" y="110" width="50" height="24" fill="#efe9db" stroke="#8a7340"/>
    <text x="400" y="126" text-anchor="middle" fill="#1c1a16" font-size="10">land</text>
    <rect x="430" y="110" width="50" height="24" fill="#efe9db" stroke="#8a7340"/>
    <text x="455" y="126" text-anchor="middle" fill="#1c1a16" font-size="10">vox</text>

    <line x1="345" y1="134" x2="345" y2="162" stroke="#8a7340" stroke-width="1.2"/>
    <line x1="400" y1="134" x2="400" y2="162" stroke="#8a7340" stroke-width="1.2"/>
    <line x1="455" y1="134" x2="455" y2="162" stroke="#8a7340" stroke-width="1.2"/>
    <line x1="345" y1="162" x2="455" y2="162" stroke="#8a7340" stroke-width="1.2"/>
    <line x1="400" y1="162" x2="400" y2="178" stroke="#8a7340" stroke-width="1.2" marker-end="url(#arr)"/>

    <g transform="translate(328 186)" fill="#3f6b3a">
      <rect width="9" height="20" opacity="0.35"/>
      <rect x="13" width="9" height="20" opacity="0.7"/>
      <rect x="26" width="9" height="20" opacity="0.5"/>
      <rect x="39" width="9" height="20" opacity="0.95"/>
      <rect x="52" width="9" height="20" opacity="0.4"/>
      <rect x="65" width="9" height="20" opacity="0.8"/>
      <rect x="78" width="9" height="20" opacity="0.55"/>
      <rect x="91" width="9" height="20" opacity="0.9"/>
      <rect x="104" width="9" height="20" opacity="0.45"/>
      <rect x="117" width="9" height="20" opacity="0.65"/>
    </g>
    <text x="400" y="226" text-anchor="middle" fill="#1c1a16" font-size="11">hidden</text>
    <text x="400" y="250" text-anchor="middle" fill="#5c574e" font-size="10">actor and critic</text>
    <text x="400" y="264" text-anchor="middle" fill="#5c574e" font-size="10">read from here</text>

    <line x1="508" y1="161" x2="548" y2="161" stroke="#8a7340" stroke-width="1.6" marker-end="url(#arr)"/>

    <!-- ACTION -->
    <text x="668" y="32" text-anchor="middle" fill="#8a7340" font-size="11" letter-spacing="0.18em">ACTION</text>
    <rect x="560" y="46" width="216" height="230" fill="#f7f2e6" stroke="rgba(28,26,22,0.16)" stroke-width="1.25"/>

    <rect x="580" y="78" width="176" height="44" fill="#efe9db" stroke="#c4a35a" stroke-width="1.4"/>
    <text x="668" y="97" text-anchor="middle" fill="#8a7340" font-size="10">actor · policy</text>
    <text x="668" y="113" text-anchor="middle" fill="#1c1a16" font-size="12">π(a|s) · 15 actions</text>

    <text x="668" y="150" text-anchor="middle" fill="#5c574e" font-size="10">sprint_jump, look, turn…</text>

    <rect x="580" y="178" width="176" height="44" fill="#efe9db" stroke="#3d5a8a" stroke-width="1.4"/>
    <text x="668" y="197" text-anchor="middle" fill="#3d5a8a" font-size="10">critic · value</text>
    <text x="668" y="213" text-anchor="middle" fill="#1c1a16" font-size="12">V(s) · how good is here</text>

    <rect x="580" y="242" width="176" height="8" fill="#efe9db" stroke="rgba(28,26,22,0.16)"/>
    <rect x="580" y="242" width="110" height="8" fill="#3d5a8a"/>
  </g>
</svg>

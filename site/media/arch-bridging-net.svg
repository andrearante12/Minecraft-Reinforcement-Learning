<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="t d">
  <title id="t">Bridging policy and value MLP</title>
  <desc id="d">A flat 220-dimensional bridging observation feeds two MLP branches: policy (actor) produces action probabilities, and critic (value) estimates V(s).</desc>
  <rect width="900" height="260" fill="#efe9db"/>

  <defs>
    <marker id="arrGold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c4a35a"/>
    </marker>
    <marker id="arrLapis" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3d5a8a"/>
    </marker>
  </defs>

  <g font-family="IBM Plex Mono, ui-monospace, monospace">
    <!-- Observation -->
    <rect x="310" y="22" width="280" height="70" rx="7" fill="#f7f2e6" stroke="#2a2d32" stroke-width="1.5"/>
    <text x="450" y="46" text-anchor="middle" fill="#8a7340" font-size="12" letter-spacing="0.16em">FLAT OBSERVATION 220</text>
    <text x="450" y="69" text-anchor="middle" fill="#5c574e" font-size="11">proprio 17 + goal delta 3 + voxels 200</text>

    <!-- Policy (actor) -->
    <rect x="70" y="130" width="370" height="120" rx="7" fill="#f7f2e6" stroke="#c4a35a" stroke-width="1.8"/>
    <text x="255" y="158" text-anchor="middle" fill="#8a7340" font-size="12" letter-spacing="0.14em">ACTOR / POLICY</text>
    <text x="90" y="183" fill="#1c1a16" font-size="11">policy MLP</text>
    <text x="90" y="203" fill="#1c1a16" font-size="10">Linear 220 -> 64 (Tanh)</text>
    <text x="90" y="220" fill="#1c1a16" font-size="10">Linear 64 -> 64 (Tanh)</text>
    <text x="90" y="237" fill="#1c1a16" font-size="10">action logits 12</text>
    <text x="90" y="251" fill="#3d5a8a" font-size="10">pi(a|s) over 12 actions</text>

    <!-- Value (critic) -->
    <rect x="460" y="130" width="370" height="120" rx="7" fill="#f7f2e6" stroke="#3d5a8a" stroke-width="1.8"/>
    <text x="645" y="158" text-anchor="middle" fill="#3d5a8a" font-size="12" letter-spacing="0.14em">CRITIC / VALUE</text>
    <text x="480" y="183" fill="#1c1a16" font-size="11">value MLP</text>
    <text x="480" y="203" fill="#1c1a16" font-size="10">Linear 220 -> 64 (Tanh)</text>
    <text x="480" y="220" fill="#1c1a16" font-size="10">Linear 64 -> 64 (Tanh)</text>
    <text x="480" y="237" fill="#1c1a16" font-size="10">value head -> V(s)</text>
    <text x="480" y="251" fill="#5c574e" font-size="10">estimated state quality</text>

    <!-- Arrows -->
    <path d="M450 92 C370 98, 290 115, 240 130" fill="none" stroke="#c4a35a" stroke-width="2" marker-end="url(#arrGold)"/>
    <path d="M450 92 C530 98, 630 115, 610 130" fill="none" stroke="#3d5a8a" stroke-width="2" marker-end="url(#arrLapis)"/>

    <text x="305" y="120" fill="#c4a35a" font-size="11" text-anchor="end">actor input</text>
    <text x="595" y="120" fill="#3d5a8a" font-size="11" text-anchor="start">critic input</text>
  </g>
</svg>


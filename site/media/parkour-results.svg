<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="t d">
  <title id="t">Parkour landing rates</title>
  <desc id="d">Landing success by gap after 18451 episodes. Vertical 66.4%, diagonal medium 60.5%, diagonal small 58.8%, one-block 44.7%, two-block 42.9%, three-block 20.1%.</desc>
  <rect width="720" height="280" fill="#efe9db"/>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#5c574e">
    <text x="24" y="28" fill="#8a7340" letter-spacing="0.14em">LANDED</text>
    <text x="696" y="28" text-anchor="end">18,451 episodes</text>
    <line x1="150" y1="48" x2="150" y2="248" stroke="rgba(28,26,22,0.12)"/>
    <line x1="150" y1="248" x2="680" y2="248" stroke="rgba(28,26,22,0.18)"/>
    <text x="142" y="252" text-anchor="end">0</text>
    <text x="142" y="148" text-anchor="end">50%</text>
    <text x="142" y="52" text-anchor="end">100%</text>
    <line x1="150" y1="144" x2="680" y2="144" stroke="rgba(28,26,22,0.08)" stroke-dasharray="3 4"/>

    <!-- bars: y = 248 - rate*2.00, height = rate*2.00 -->
    <rect x="172" y="159" width="56" height="89" fill="#c4a35a"/>
    <text x="200" y="152" text-anchor="middle" fill="#1c1a16">45%</text>
    <text x="200" y="266" text-anchor="middle">1-blk</text>

    <rect x="252" y="162" width="56" height="86" fill="#c4a35a"/>
    <text x="280" y="156" text-anchor="middle" fill="#1c1a16">43%</text>
    <text x="280" y="266" text-anchor="middle">2-blk</text>

    <rect x="332" y="208" width="56" height="40" fill="#8a7340"/>
    <text x="360" y="202" text-anchor="middle" fill="#1c1a16">20%</text>
    <text x="360" y="266" text-anchor="middle">3-blk</text>

    <rect x="412" y="115" width="56" height="133" fill="#3f6b3a"/>
    <text x="440" y="108" text-anchor="middle" fill="#1c1a16">66%</text>
    <text x="440" y="266" text-anchor="middle">vert</text>

    <rect x="492" y="130" width="56" height="118" fill="#3f6b3a"/>
    <text x="520" y="124" text-anchor="middle" fill="#1c1a16">59%</text>
    <text x="520" y="266" text-anchor="middle">diag S</text>

    <rect x="572" y="127" width="56" height="121" fill="#3f6b3a"/>
    <text x="600" y="121" text-anchor="middle" fill="#1c1a16">61%</text>
    <text x="600" y="266" text-anchor="middle">diag M</text>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" role="img" aria-labelledby="t d">
  <title id="t">Bridging training pipeline</title>
  <desc id="d">Human demonstrations warm-start a PPO actor-critic. Record demos, clone the actor-critic policy, then fine-tune with SB3 PPO.</desc>
  <rect width="900" height="200" fill="#efe9db"/>

  <defs>
    <marker id="arrGold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c4a35a"/>
    </marker>
    <marker id="arrLapis" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3d5a8a"/>
    </marker>
  </defs>

  <g font-family="IBM Plex Mono, ui-monospace, monospace">
    <!-- Human demos -->
    <rect x="55" y="50" width="250" height="95" rx="6" fill="#f7f2e6" stroke="#2a2d32" stroke-width="1.5"/>
    <text x="180" y="80" text-anchor="middle" fill="#8a7340" font-size="12" letter-spacing="0.16em">HUMAN DEMOS</text>
    <text x="180" y="102" text-anchor="middle" fill="#1c1a16" font-size="11">record_demos.py</text>
    <text x="180" y="123" text-anchor="middle" fill="#5c574e" font-size="10">JSON trajectories</text>

    <!-- Behavioral cloning -->
    <rect x="330" y="33" width="240" height="129" rx="6" fill="#f7f2e6" stroke="#2a2d32" stroke-width="1.5"/>
    <rect x="330" y="33" width="240" height="10" rx="6" fill="#c4a35a" opacity="0.35"/>
    <text x="450" y="67" text-anchor="middle" fill="#8a7340" font-size="12" letter-spacing="0.16em">BEHAVIORAL CLONING</text>
    <text x="450" y="91" text-anchor="middle" fill="#1c1a16" font-size="11">clone same ActorCritic</text>
    <text x="450" y="112" text-anchor="middle" fill="#5c574e" font-size="10">warm start policy &amp; value</text>

    <!-- SB3 PPO -->
    <rect x="600" y="50" width="250" height="95" rx="6" fill="#f7f2e6" stroke="#2a2d32" stroke-width="1.5"/>
    <rect x="600" y="50" width="250" height="10" rx="6" fill="#3d5a8a" opacity="0.25"/>
    <text x="725" y="80" text-anchor="middle" fill="#8a7340" font-size="12" letter-spacing="0.16em">SB3 PPO</text>
    <text x="725" y="103" text-anchor="middle" fill="#1c1a16" font-size="11">150-step episodes</text>
    <text x="725" y="123" text-anchor="middle" fill="#5c574e" font-size="10">higher entropy</text>

    <!-- Arrows -->
    <path d="M305 95 C315 95, 320 95, 330 95" fill="none" stroke="#c4a35a" stroke-width="2" marker-end="url(#arrGold)"/>
    <path d="M570 95 C580 95, 590 95, 600 95" fill="none" stroke="#c4a35a" stroke-width="2" marker-end="url(#arrGold)"/>
    <text x="318" y="74" text-anchor="middle" fill="#c4a35a" font-size="11">clone</text>
    <text x="585" y="74" text-anchor="middle" fill="#c4a35a" font-size="11">fine-tune</text>
  </g>
</svg>

